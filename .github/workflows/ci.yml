name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - check:format
          - check:sdk
          - typecheck
          - test
          - build
          - check:openapi
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.task }}

  validate-production-build:
    strategy:
      fail-fast: false
      matrix:
        bb: [0.40.0, 0.43.4]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev --omit=optional --ignore-scripts
        env:
          NODE_ENV: production
      - run: npx --yes --package=bb-app@${{ matrix.bb }} bb plugin build .
